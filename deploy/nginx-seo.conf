# Include inside the existing HTTPS server block AFTER removing its old `location /`.
# Keep the existing /api/, /ws/, /admin/, /superuser/, /media/ and /static/ blocks.
# Run nginx -t on the actual server before reload; this fragment is not a full config.

error_page 404 /404.html;
location ~ ^/item/([^/]+)/?$ { return 301 /product/$1; }
location = /menu/shakes { return 301 /menu/drinks; }
location = /burger { return 301 /menu/burgers; }
location = /fried-chicken { return 301 /menu/fried-chicken; }
location = /pakoda { return 301 /menu/pakoda; }
location = /fries { return 301 /menu/fries; }
location = /sandwich { return 301 /menu/sandwiches; }
location = /drink { return 301 /menu/drinks; }
location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, follow" always;
}

# Only known application routes may fall back to the React shell.
location = /admin {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri @crunchy_private_app;
}
location ~ ^/(?:login|admin-login|admin-portal|superadmin|brand|outlet|dashboard|pos|staff|kds|waiter|rider|portal-control)(?:/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ @crunchy_private_app;
}
location ~ ^/(?:track|table-qr|kiosk|tv|orders|profile|checkout)/?$ {
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ @crunchy_private_app;
}

location @crunchy_private_app {
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

# Public pages must exist in the generated build; unknown URLs return a real 404.
# Check the generated HTML file before the directory so Nginx does not add a slash.
# Canonical tags, sitemaps and internal links intentionally use slashless URLs.
location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri/index.html $uri =404;
}
