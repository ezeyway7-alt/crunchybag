# Map old query-link product parameter (?product=prod-... -> /product/...)
map $arg_product $seo_product_target {
    default "";
    "~*^(?:\{product_id\}|%7Bproduct_id%7D|^\{)" "404";
    "~*^prod-(?<p_slug>[a-zA-Z0-9-]+)$" "/product/$p_slug";
    "~*^(?<p_id>[a-zA-Z0-9-]+)$" "/product/$p_id";
}

# Map legacy item parameter (?item=...)
map $arg_item $seo_item_target {
    default "";
    "~*^(?:\{product_id\}|%7Bproduct_id%7D|^\{)" "404";
    "~*^prod-(?<i_slug>[a-zA-Z0-9-]+)$" "/product/$i_slug";
    "~*^(?<i_id>[a-zA-Z0-9-]+)$" "/product/$i_id";
}

# Map legacy combo parameter (?combo=...)
map $arg_combo $seo_combo_target {
    default "";
    "~*^(?:\{product_id\}|%7Bproduct_id%7D|^\{)" "404";
    "~*^prod-(?<c_slug>[a-zA-Z0-9-]+)$" "/product/$c_slug";
    "~*^(?<c_id>[a-zA-Z0-9-]+)$" "/product/$c_id";
}

# ==============================================================================
# PART 2: SERVER BLOCK DIRECTIVES (Place inside HTTPS `server { ... }`)
# ==============================================================================

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, follow" always;
}

# Return real 404 immediately for invalid placeholder product URLs
location ~* ^/product/(?:\{product_id\}|%7Bproduct_id%7D|\{) {
    return 404;
}

# Query link redirects & 404s
if ($seo_product_target = "404") {
    return 404;
}
if ($seo_product_target != "") {
    return 301 $seo_product_target;
}
if ($seo_item_target = "404") {
    return 404;
}
if ($seo_item_target != "") {
    return 301 $seo_item_target;
}
if ($seo_combo_target = "404") {
    return 404;
}
if ($seo_combo_target != "") {
    return 301 $seo_combo_target;
}
if ($seo_location_target != "") {
    return 301 $seo_location_target;
}
if ($seo_page_target != "") {
    return 301 $seo_page_target;
}
if ($seo_category_target != "") {
    return 301 $seo_category_target;
}

# Legacy category & item redirects
location ~ ^/item/([^/]+)/?$ { return 301 /product/$1; }
location ~ ^/(?:drink|drinks|menu/shakes)/?$ { return 301 /menu/drinks; }
location ~ ^/burger/?$ { return 301 /menu/burgers; }
location ~ ^/fried-chicken/?$ { return 301 /menu/fried-chicken; }
location ~ ^/pakoda/?$ { return 301 /menu/pakoda; }
location ~ ^/fries/?$ { return 301 /menu/fries; }
location ~ ^/sandwich(?:es)?/?$ { return 301 /menu/sandwiches; }

# Only known application routes may fall back to the React shell.
location = /admin {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri @crunchy_private_app;
}
location ~ ^/(?:login|admin-login|admin-portal|superadmin|brand|outlet|dashboard|pos|staff|kds|waiter|rider|portal-control)(?:/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ @crunchy_private_app;
}
location ~ ^/(?:track|table-qr|kiosk|tv|orders|profile|checkout)/?$ {
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ @crunchy_private_app;
}

location @crunchy_private_app {
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

# Public pages must exist in the generated build; unknown URLs return a real 404.
# Check the generated HTML file before the directory so Nginx does not add a slash.
# Canonical tags, sitemaps and internal links intentionally use slashless URLs.
location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri/index.html $uri =404;
}
