# Map old query-link page parameters (?page=menu, etc.)
map $arg_page $seo_page_target {
    default "";
    menu "/menu";
    combos "/combos";
    special "/combos";
    reserve "/reserve";
    orders "/orders";
    track "/track";
    profile "/profile";
    about "/about";
    contact "/contact";
    faq "/faq";
    terms "/terms";
    privacy "/privacy";
    takeaway "/takeaway";
    delivery "/delivery";
    blogs "/blogs";
    blog "/blogs";
}

# Map category parameters (?category=...)
map $arg_category $seo_category_target {
    default "";
    cat-burgers-97a60a528a81 "/menu/burgers";
    cat-burger-sandwich-f6f4a4e52b5b "/menu/burgers";
    burgers "/menu/burgers";
    burger "/menu/burgers";
    cat-fried-chiken-330fbd829bc2 "/menu/fried-chicken";
    cat-crunchy-fried-chicken-9edcce2efb22 "/menu/fried-chicken";
    fried-chicken "/menu/fried-chicken";
    cat-drinks-5493c0ec1baf "/menu/drinks";
    drinks "/menu/drinks";
    drink "/menu/drinks";
    shakes "/menu/drinks";
    cat-fries-crispy-0ebc7a494c41 "/menu/fries";
    fries "/menu/fries";
