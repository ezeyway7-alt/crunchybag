<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0A0A0B"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.4"/>
  
  <defs>
    <linearGradient id="favBagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24"/>
      <stop offset="50%" stopColor="#F59E0B"/>
      <stop offset="100%" stopColor="#EA580C"/>
    </linearGradient>
    <linearGradient id="favLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#16A34A"/>
      <stop offset="100%" stopColor="#4ADE80"/>
    </linearGradient>
  </defs>

  <!-- Green Leaf on top right -->
  <g transform="translate(48, 12) rotate(35)">
    <path d="M 0 9 C -3 4 -1 0 7 -2 C 10 5 6 11 0 9 Z" fill="url(#favLeafGrad)"/>
    <path d="M 1 8 Q 4 4 6 -1" stroke="#DCFCE7" stroke-width="0.8" fill="none"/>
  </g>

  <!-- "crunchy" curved top text -->
  <text x="31" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="-0.3">
    crunchy
  </text>

  <!-- Left speed streak -->
  <path d="M 6 40 L 14 39 L 14 42 L 8 43 Z" fill="#F59E0B"/>
  <path d="M 9 46 L 15 45 L 15 48 L 11 48 Z" fill="#F59E0B"/>

  <!-- Right speed streak -->
  <path d="M 50 39 L 58 40 L 56 43 L 50 42 Z" fill="#F59E0B"/>
  <path d="M 49 45 L 55 46 L 53 48 L 49 48 Z" fill="#F59E0B"/>

  <!-- "bag" bold text -->
  <text x="32" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="url(#favBagGrad)" letter-spacing="-0.5">
    bag
  </text>
</svg>
