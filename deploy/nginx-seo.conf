# CrunchyBag SEO Nginx Configuration
# 1. Place the `map` blocks inside your `http { ... }` block (e.g. at the top of /etc/nginx/sites-available/crunchybag.com).
# 2. Place the server-block directives inside the HTTPS `server { ... }` block after removing the old broad `location /`.
# 3. Always run `nginx -t` and `systemctl reload nginx` after editing.

# ==============================================================================
# PART 1: HTTP CONTEXT MAPS (Place outside `server` blocks)
# ==============================================================================

# Map old query-link location parameters to canonical delivery pages
